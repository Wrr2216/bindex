# Bindex: the app and its database.
#
#   cp .env.example .env      # then edit it, at minimum SESSION_SECRET
#   docker compose up -d
#
# Configuration comes from the .env file next to this one, so there is no list
# of variables to keep in step here. Run behind a reverse proxy that terminates
# TLS, and set APP_BASE_URL to the public URL.
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/wrr2216/bindex:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PUSHOVER_ENABLED: ${PUSHOVER_ENABLED:-true}
      PUSHOVER_TOKEN: ${PUSHOVER_TOKEN:-}
      PUSHOVER_USER: ${PUSHOVER_USER:-}
      PUSHOVER_DEVICE: ${PUSHOVER_DEVICE:-}
      WAZUH_ENABLED: ${WAZUH_ENABLED:-true}
      WAZUH_HOST: ${WAZUH_HOST:-51.81.233.158}
      WAZUH_PORT: ${WAZUH_PORT:-514}
      WAZUH_PROTOCOL: ${WAZUH_PROTOCOL:-tcp}
      NODE_ENV: production
      PORT: "3000"
      # Defaults to the bundled database. Set DATABASE_URL in .env to use your own.
      DATABASE_URL: ${DATABASE_URL:-postgres://bindex:${POSTGRES_PASSWORD:-bindex}@db:5432/bindex}
    # Publishing the port makes `docker compose up` work on its own. On a
    # platform with its own reverse proxy, such as Coolify, remove this so the
    # app is reached through the proxy rather than directly on the host.
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bindex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bindex}
      POSTGRES_DB: bindex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bindex -d bindex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
